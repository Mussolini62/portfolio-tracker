<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="McCall Portfolio"/>
<meta name="theme-color" content="#faf8f3"/>
<title>McCall Family Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#faf8f3; --bg2:#f3f0e8; --bg3:#ede9df; --bg4:#e6e2d6;
  --card:#ffffff; --card2:#fdfcf9;
  --border:rgba(10,25,60,0.09); --border2:rgba(10,25,60,0.16);
  --navy:#0a193c; --navy2:#1a2d5a; --navy3:#2e4a8a;
  --gold:#b8872a; --gold2:#d4a843; --gold-bg:rgba(184,135,42,0.1); --gold-border:rgba(184,135,42,0.28); --gold-glow:rgba(184,135,42,0.2);
  --green:#00a651; --green-bg:rgba(0,166,81,0.1); --green-border:rgba(0,166,81,0.35); --green-glow:rgba(0,166,81,0.4);
  --red:#cc1f1f; --red-bg:rgba(204,31,31,0.08); --red-border:rgba(204,31,31,0.28);
  --amber:#e07800; --amber-bg:rgba(224,120,0,0.1); --amber-border:rgba(224,120,0,0.3);
  --blue:#1a56db; --blue-bg:rgba(26,86,219,0.08);
  --text:#0a193c; --text2:rgba(10,25,60,0.68); --text3:rgba(10,25,60,0.4);
  --serif:'Playfair Display',Georgia,serif;
  --body:'Outfit',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --shadow:0 2px 12px rgba(10,25,60,0.07),0 1px 3px rgba(10,25,60,0.05);
  --shadow-md:0 4px 20px rgba(10,25,60,0.1),0 2px 6px rgba(10,25,60,0.06);
  --shadow-lg:0 8px 32px rgba(10,25,60,0.12),0 2px 8px rgba(10,25,60,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);overflow-x:hidden;}
body{font-family:var(--body);background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 10% 10%,rgba(184,135,42,0.05),transparent 60%),
    radial-gradient(ellipse 50% 30% at 90% 90%,rgba(10,25,60,0.04),transparent 60%);}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-bottom:100px;}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:100;background:rgba(250,248,243,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:2px solid var(--border);padding:14px 16px 12px;box-shadow:0 2px 16px rgba(10,25,60,0.06);}
.header-inner{display:flex;justify-content:space-between;align-items:center;}
.header-brand{display:flex;align-items:center;gap:11px;}
.header-icon{width:40px;height:40px;border-radius:11px;flex-shrink:0;background:linear-gradient(135deg,var(--gold),#8b6410);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 14px var(--gold-glow);}
.header-title{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-0.02em;line-height:1.1;}
.header-sub{font-family:var(--mono);font-size:8px;color:var(--text3);margin-top:2px;letter-spacing:0.1em;text-transform:uppercase;}
.header-btns{display:flex;gap:8px;align-items:center;}
.btn-refresh{display:flex;align-items:center;gap:6px;background:var(--navy);color:#fff;border:none;border-radius:11px;padding:9px 14px;font-family:var(--mono);font-size:10px;font-weight:500;cursor:pointer;white-space:nowrap;box-shadow:0 4px 12px rgba(10,25,60,0.22);transition:all .2s;}
.btn-refresh:active{transform:scale(0.95);}
.ri{display:inline-block;}
.btn-refresh.spinning .ri{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── NAV TABS ── */
.nav-tabs{display:flex;gap:0;background:var(--bg2);border-bottom:1px solid var(--border);}
.nav-tab{flex:1;padding:11px 8px;font-family:var(--body);font-size:11px;font-weight:500;color:var(--text3);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;text-align:center;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--card);}
.nav-tab:active{background:var(--bg3);}

/* ── FAMILY DASHBOARD ── */
.dashboard{padding:14px 14px 0;}

.family-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
.family-title{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-0.02em;}
.family-sub{font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-top:3px;}
.family-total{text-align:right;}
.family-total-val{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--navy);letter-spacing:-0.03em;}
.family-total-lbl{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;margin-top:2px;}

/* BIG STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px;}
.stat-card{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);}
.stat-card.highlight{border-color:var(--gold-border);background:linear-gradient(135deg,rgba(184,135,42,0.04),var(--card));}
.stat-card.green-hi{border-color:var(--green-border);background:linear-gradient(135deg,rgba(0,166,81,0.04),var(--card));}
.stat-card.red-hi{border-color:var(--red-border);background:linear-gradient(135deg,rgba(204,31,31,0.03),var(--card));}
.stat-label{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
.stat-val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-0.02em;line-height:1;}
.stat-sub{font-family:var(--mono);font-size:9px;margin-top:4px;}

/* ACCOUNT BREAKDOWN */
.acct-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.acct-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
.acct-owner{font-family:var(--mono);font-size:8px;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:4px;}
.acct-name{font-family:var(--body);font-size:12px;font-weight:600;color:var(--navy);margin-bottom:6px;}
.acct-val{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--navy);}
.acct-gl{font-family:var(--mono);font-size:10px;margin-top:3px;}

/* CASH ISA STRIP */
.cash-strip{background:var(--card);border:1.5px solid var(--gold-border);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.cash-strip-title{font-family:var(--serif);font-size:12px;font-weight:600;color:var(--gold);margin-bottom:8px;}
.cash-strip-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);}
.cash-strip-row:last-child{border-bottom:none;}
.csr-left{font-family:var(--body);font-size:11px;color:var(--text2);}
.csr-owner{font-family:var(--mono);font-size:8px;color:var(--gold);margin-right:4px;}
.csr-right{display:flex;align-items:center;gap:10px;}
.csr-rate{font-family:var(--mono);font-size:9px;color:var(--green);background:var(--green-bg);padding:2px 6px;border-radius:6px;}
.csr-val{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy);}

/* DIVIDEND SUMMARY */
.div-summary{background:var(--card);border:1.5px solid var(--green-border);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
.div-summary-title{font-family:var(--serif);font-size:12px;font-weight:600;color:var(--green);margin-bottom:8px;}
.div-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.div-item-val{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--navy);}
.div-item-lbl{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-top:2px;}

/* ── HOLDINGS VIEW ── */
.holdings-view{padding:12px 14px 0;}
.holdings-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.holdings-title{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--navy);}
.owner-filter{display:flex;gap:6px;}
.of-btn{font-family:var(--mono);font-size:9px;padding:5px 10px;border-radius:16px;border:1.5px solid var(--border2);color:var(--text3);background:var(--card);cursor:pointer;transition:all .2s;font-weight:500;}
.of-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.of-btn:active{transform:scale(0.95);}

/* HOLDING CARD */
.hcard{background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:8px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .2s;}
.hcard:active{box-shadow:var(--shadow-md);}
.hcard.gain{border-left:4px solid var(--green);}
.hcard.loss{border-left:4px solid var(--red);}
.hcard.neutral{border-left:4px solid var(--amber);}

.hcard-top{padding:12px 14px 10px 14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.hcard-left{flex:1;min-width:0;}
.hcard-nameline{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;}
.gl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.gld-g{background:var(--green);box-shadow:0 0 0 2px rgba(0,166,81,0.2);}
.gld-r{background:var(--red);box-shadow:0 0 0 2px rgba(204,31,31,0.15);}
.gld-n{background:var(--amber);box-shadow:0 0 0 2px rgba(224,120,0,0.2);}
.hcard-name{font-family:var(--body);font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hcard-meta{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap;}
.hcard-sym{font-family:var(--mono);font-size:9px;color:var(--text3);font-weight:500;}
.hcard-owner-tag{font-family:var(--mono);font-size:8px;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold-border);border-radius:6px;padding:1px 6px;font-weight:500;}
.hcard-units{font-family:var(--mono);font-size:8px;color:var(--text3);}

.hcard-right{text-align:right;flex-shrink:0;}
.hcard-price{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--navy);line-height:1;letter-spacing:-0.02em;}
.hcard-price.loading{color:transparent;background:var(--bg3);border-radius:5px;animation:shimmer 1.5s infinite;min-width:70px;display:inline-block;}
@keyframes shimmer{0%{opacity:.4}50%{opacity:.9}100%{opacity:.4}}
.hcard-daychange{font-family:var(--mono);font-size:10px;margin-top:3px;font-weight:500;}
.up{color:var(--green);}.dn{color:var(--red);}

/* PERFORMANCE ROW */
.hcard-perf{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);background:var(--card2);}
.perf-cell{padding:8px 10px;text-align:center;border-right:1px solid var(--border);}
.perf-cell:last-child{border-right:none;}
.perf-label{font-family:var(--mono);font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:3px;}
.perf-val{font-family:var(--mono);font-size:11px;font-weight:600;}
.pv-g{color:var(--green);}.pv-r{color:var(--red);}.pv-gold{color:var(--gold);}.pv-dim{color:var(--text3);}.pv-blue{color:var(--blue);}

/* EXPANDED DETAIL */
.hcard-detail{border-top:1px solid var(--border);background:var(--bg2);padding:12px 14px;animation:slideDown .2s cubic-bezier(.4,0,.2,1);}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.detail-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 11px;}
.detail-box-label{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px;}
.detail-box-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--navy);}
.detail-box-sub{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:2px;}

/* DIVIDEND LOG */
.div-section{margin-top:2px;}
.div-section-title{font-family:var(--mono);font-size:8px;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;font-weight:600;margin-bottom:8px;}
.div-log-entries{max-height:120px;overflow-y:auto;margin-bottom:8px;}
.div-entry{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--card);border-radius:7px;margin-bottom:4px;border:1px solid var(--border);}
.div-entry-date{font-family:var(--mono);font-size:9px;color:var(--text3);}
.div-entry-amount{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--green);}
.div-entry-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 4px;line-height:1;}
.div-add-row{display:flex;gap:6px;align-items:center;}
.div-input{flex:1;background:var(--card);border:1.5px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:11px;outline:none;transition:border-color .2s;}
.div-input:focus{border-color:var(--gold);}
.div-date-input{width:110px;background:var(--card);border:1.5px solid var(--border2);color:var(--text);border-radius:8px;padding:7px 8px;font-family:var(--mono);font-size:10px;outline:none;transition:border-color .2s;}
.div-date-input:focus{border-color:var(--gold);}
.btn-log-div{background:var(--green);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px rgba(0,166,81,0.25);}
.btn-log-div:active{transform:scale(0.95);}
.div-total-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:8px;margin-bottom:8px;}
.div-total-lbl{font-family:var(--mono);font-size:9px;color:var(--text3);}
.div-total-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--green);}
.btn-detail-refresh{background:var(--card);border:1.5px solid var(--border2);color:var(--text3);border-radius:8px;padding:6px 12px;font-family:var(--mono);font-size:9px;cursor:pointer;margin-top:8px;}
.btn-detail-refresh:active{background:var(--bg3);}

/* YIELD DISPLAY */
.yield-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.yield-chip{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:8px;font-weight:500;}
.yc-cost{background:var(--gold-bg);border:1px solid var(--gold-border);color:var(--gold);}
.yc-market{background:var(--blue-bg);border:1px solid rgba(26,86,219,0.2);color:var(--blue);}
.yc-projected{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green);}

/* ── CASH VIEW ── */
.cash-view{padding:12px 14px 0;}
.cash-account-card{background:var(--card);border:1.5px solid var(--gold-border);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow);}
.cash-acct-header{padding:14px 16px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,var(--gold-bg),var(--card));}
.cash-acct-title{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--navy);}
.cash-acct-owner{font-family:var(--mono);font-size:8px;color:var(--gold);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:3px;}
.cash-acct-row{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);}
.cash-acct-row:last-child{border-bottom:none;}
.car-name{font-family:var(--body);font-size:12px;font-weight:500;color:var(--navy);}
.car-rate{font-family:var(--mono);font-size:9px;color:var(--green);background:var(--green-bg);padding:2px 7px;border-radius:6px;font-weight:500;}
.car-val{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--navy);}
.car-interest{font-family:var(--mono);font-size:9px;color:var(--text3);margin-top:1px;}

/* ── DIVIDEND VIEW ── */
.div-view{padding:12px 14px 0;}
.div-overview-card{background:var(--card);border:1.5px solid var(--green-border);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:var(--shadow);}
.div-overview-title{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--green);margin-bottom:12px;}
.div-big-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.div-big-item{background:var(--bg2);border-radius:12px;padding:10px 12px;border:1px solid var(--border);}
.dbi-val{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--navy);}
.dbi-lbl{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;margin-top:3px;}
.div-stock-summary{background:var(--card);border:1.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);}
.dss-header{display:grid;grid-template-columns:1fr 80px 80px 80px;gap:8px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);}
.dss-hcell{font-family:var(--mono);font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:0.07em;}
.dss-row{display:grid;grid-template-columns:1fr 80px 80px 80px;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);align-items:center;}
.dss-row:last-child{border-bottom:none;}
.dss-name{font-family:var(--body);font-size:11px;font-weight:500;color:var(--navy);}
.dss-cell{font-family:var(--mono);font-size:10px;text-align:right;}

/* ── FOOTER ── */
.footer{padding:16px 14px;text-align:center;}
.footer-update{font-family:var(--mono);font-size:9px;color:var(--text3);margin-bottom:4px;}
.footer-note{font-family:var(--mono);font-size:8px;color:rgba(10,25,60,0.18);line-height:1.7;}

/* FAB */
.fab{position:fixed;bottom:24px;right:16px;z-index:200;width:46px;height:46px;border-radius:50%;background:var(--navy);border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(10,25,60,0.28);transition:transform .2s;}
.fab:active{transform:scale(0.88);}
</style>
</head>
<body>

<div class="app">

<!-- HEADER -->
<div class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-icon">⚖</div>
      <div>
        <div class="header-title">McCall Portfolio</div>
        <div class="header-sub" id="hdrDate">Loading...</div>
      </div>
    </div>
    <div class="header-btns">
      <button class="btn-refresh" id="refreshBtn" onclick="refreshAllPrices()">
        <span class="ri">↻</span><span id="refreshTxt"> Refresh</span>
      </button>
    </div>
  </div>
</div>

<!-- NAV TABS -->
<div class="nav-tabs">
  <button class="nav-tab active" onclick="showView('dashboard',this)">📊 Overview</button>
  <button class="nav-tab" onclick="showView('holdings',this)">📦 Holdings</button>
  <button class="nav-tab" onclick="showView('cash',this)">💰 Cash</button>
  <button class="nav-tab" onclick="showView('dividends',this)">🌿 Dividends</button>
</div>

<!-- VIEWS -->
<div id="view-dashboard" class="dashboard"></div>
<div id="view-holdings" class="holdings-view" style="display:none"></div>
<div id="view-cash" class="cash-view" style="display:none"></div>
<div id="view-dividends" class="div-view" style="display:none"></div>

<div class="footer">
  <div class="footer-update" id="lastUpdate">Tap Refresh to load live prices</div>
  <div class="footer-note">Private & offline · McCall Family Portfolio · Data from HL 31 May 2026<br/>Prices via AI — verify before trading · Not financial advice</div>
</div>
</div>

<button class="fab" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
// ══════════════════════════════════════════════════════════════
//  PORTFOLIO DATA — McCall Family — 31 May 2026
// ══════════════════════════════════════════════════════════════

function fmt(n, dec=0){ return n==null?'—':Number(n).toLocaleString('en-GB',{minimumFractionDigits:dec,maximumFractionDigits:dec}); }
function fmtP(n){ return n==null?'—':fmt(n,0)+'p'; }
function fmtGBP(n, dec=0){ return n==null?'—':'£'+fmt(Math.abs(n),dec); }
function fmtPct(n, dec=1){ return n==null?'—':(n>=0?'+':'')+Number(n).toFixed(dec)+'%'; }
function fmtDayChange(n){ return n==null?'—':(n>=0?'+':'')+Number(n).toFixed(2)+'%'; }

function getPrice(h) {
  const sym = h.fetchSym || h.sym;
  return prices[sym]?.price ?? h.lastPriceHL;
}
function getValue(h){ return (getPrice(h) * h.units) / 100; }
function getCostPP(h){ return (h.costTotal / h.units) * 100; } // pence per share
function getGL(h){ return getValue(h) - h.costTotal; }
function getGLPct(h){ return (getGL(h) / h.costTotal) * 100; }
function getTotalDivs(sym){ return (dividends[sym]||[]).reduce((a,d)=>a+d.amount,0); }
function getProjectedAnnualDiv(h){ return ((DIV_PER_SHARE[h.sym]||0) * h.units)/100; }
function getTotalReturn(h){ return getGL(h) + getTotalDivs(h.sym); }
function getTotalReturnPct(h){ return (getTotalReturn(h) / h.costTotal) * 100; }
function getYieldOnCost(h){
  const dps = DIV_PER_SHARE[h.sym]||0;
  const cpp = getCostPP(h);
  return cpp>0 ? (dps/cpp)*100 : 0;
}
function getYieldOnMarket(h){
  const dps = DIV_PER_SHARE[h.sym]||0;
  const mp = getPrice(h);
  return mp>0 ? (dps/mp)*100 : 0;
}

// Portfolio totals
function getTotals(filter='all'){
  const hs = filter==='all' ? HOLDINGS : HOLDINGS.filter(h=>h.owner===filter);
  const totalCost = hs.reduce((a,h)=>a+h.costTotal,0);
  const totalVal = hs.reduce((a,h)=>a+getValue(h),0);
  const totalGL = totalVal - totalCost;
  const totalDivs = hs.reduce((a,h)=>a+getTotalDivs(h.sym),0);
  const projDiv = hs.reduce((a,h)=>a+getProjectedAnnualDiv(h),0);
  const totalReturn = totalGL + totalDivs;
  const dayChangeParts = hs.map(h=>{ const sym=h.fetchSym||h.sym; const pct=prices[sym]?.changePct; if(pct==null)return null; return getValue(h)*pct/100; }).filter(v=>v!=null);
  const totalDayGBP = dayChangeParts.length>0 ? dayChangeParts.reduce((a,v)=>a+v,0) : null;
  return {totalCost,totalVal,totalGL,totalGLPct:(totalGL/totalCost)*100,totalDivs,projDiv,totalReturn,totalReturnPct:(totalReturn/totalCost)*100,totalDayGBP};
}
function getCashTotal(){ return CASH_ACCOUNTS.reduce((a,c)=>a+c.balance,0); }
function getCashInterest(){ return CASH_ACCOUNTS.reduce((a,c)=>a+(c.balance*c.rate/100),0); }

const TDKEY='1690b9528b814da28f9e12d34a3394ac';

// [symbol, exchange] pairs for portfolio holdings
const TD_PORT={
  'ATYM.L': ['ATYM','LSE'],  'GAMA.L': ['GAMA','LSE'],  'HSBA.L': ['HSBA','LSE'],
  'IMI.L':  ['IMI','LSE'],   'LUCE.L': ['LUCE','LSE'],   'MAB1.L': ['MAB','LSE'],
  'SN.L':   ['SN','LSE'],    'AAF.L':  ['AAF','LSE'],    'BA.L':   ['BA','LSE'],
  'FSG.L':  ['FSG','LSE'],   'BGEO.L': ['BGEO','LSE'],   'MONY.L': ['MONY','LSE'],
  'RIO.L':  ['RIO','LSE'],   'RS1.L':  ['RS1','LSE'],
};

function isHosted(){return window.location.protocol==='https:'||window.location.protocol==='http:';}

async function fetchBatch(appSyms){
  for(const sym of appSyms){
    const cfg=TD_PORT[sym];
    if(!cfg) continue;
    const [tdSym,exch]=cfg;
    let url=`https://api.twelvedata.com/quote?symbol=${tdSym}&apikey=${TDKEY}&dp=2`;
    if(exch) url+=`&exchange=${exch}`;
    try{
      const r=await fetch(url);
      if(!r.ok){console.warn(`TD ${sym}: HTTP ${r.status}`);continue;}
      const d=await r.json();
      if(d.status==='error'){console.warn(`TD ${sym}:`,d.message);continue;}
      const price=parseFloat(d.close);
      if(!isNaN(price)&&price>0){
        prices[sym]={price,change:parseFloat(d.change)||null,changePct:parseFloat(d.percent_change)||null,ts:Date.now()};
        console.log(`✅ ${sym}: ${price}`);
      }
    }catch(e){console.warn(`TD ${sym} failed:`,e.message);}
    await new Promise(r=>setTimeout(r,500));
  }
  saveState();
}

async function fetchPrice(sym){
  if(!isHosted()) return null;
  await fetchBatch([sym]);
  return prices[sym]||null;
}

async function fetchAllPrices(){ return false; }

async function refreshAllPrices(){
  if(refreshing) return;
  refreshing = true;
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  if(!isHosted()){
    document.getElementById('lastUpdate').textContent='⚠️ Open via GitHub Pages URL to load live prices';
    btn.classList.remove('spinning');
    document.getElementById('refreshTxt').textContent=' Refresh';
    refreshing=false; return;
  }
  // Fetch one stock at a time with 8 second gaps to respect 8/min rate limit
  const syms=Object.keys(TD_PORT);
  for(let i=0;i<syms.length;i++){
    document.getElementById('refreshTxt').textContent=` ${i+1}/${syms.length}`;
    document.getElementById('lastUpdate').textContent=`Loading ${syms[i]}... (${i+1} of ${syms.length})`;
    await fetchBatch([syms[i]]);
    // Re-render after each stock so prices appear as they load
    renderDashboard();
    if(currentView==='holdings') renderHoldings();
    if(i<syms.length-1) await new Promise(r=>setTimeout(r,8000));
  }
  // Final full render when complete
  renderCurrentView();
  renderDashboard();
  btn.classList.remove('spinning');
  document.getElementById('refreshTxt').textContent = ' Refresh';
  document.getElementById('lastUpdate').textContent = 'Yahoo Finance · Updated '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  refreshing = false;
  renderCurrentView();
}

        ${divEntries.length===0?'<div style="font-family:var(--mono);font-size:9px;color:var(--text3);padding:4px 0;">No dividends logged yet</div>':''}

          <div class="div-entry">
            <span class="div-entry-date">${d.date}</span>
            <span class="div-entry-amount">+£${fmt(d.amount,2)}</span>
            <button class="div-entry-del" onclick="delDiv('${h.sym}',${i},event)">×</button>
          </div>`).join('')}
      </div>
      <div class="div-add-row">
        <input class="div-date-input" type="date" id="divdate_${h.sym.replace(/\W/g,'_')}" value="${new Date().toISOString().split('T')[0]}"/>
        <input class="div-input" type="number" id="divamt_${h.sym.replace(/\W/g,'_')}" placeholder="£ amount"/>
        <button class="btn-log-div" onclick="logDiv('${h.sym}',event)">+ Log</button>
      </div>
    </div>
    <button class="btn-detail-refresh" onclick="refreshOne('${h.fetchSym||h.sym}',event)">↻ Refresh Price</button>`;

  card.appendChild(det);
}

function logDiv(sym, e){
  e.stopPropagation();
  const safeSym = sym.replace(/\W/g,'_');
  const dateEl = document.getElementById('divdate_'+safeSym);
  const amtEl = document.getElementById('divamt_'+safeSym);
  const amt = parseFloat(amtEl.value);
  if(isNaN(amt)||amt<=0) return;
  if(!dividends[sym]) dividends[sym]=[];
  dividends[sym].push({date:dateEl.value||new Date().toISOString().split('T')[0], amount:amt});
  saveState();
  amtEl.value='';
  // Rebuild the detail
  const h = HOLDINGS.find(h=>h.sym===sym);
  const card = document.getElementById('hcard_'+sym.replace(/\W/g,'_'));
  if(card){ card.querySelector('.hcard-detail')?.remove(); toggleHoldingDetail(card,h); }
  renderCurrentView();
}

function delDiv(sym, idx, e){
  e.stopPropagation();
  if(!dividends[sym]) return;
  dividends[sym].splice(idx,1);
  saveState();
  const h = HOLDINGS.find(h=>h.sym===sym);
  const card = document.getElementById('hcard_'+sym.replace(/\W/g,'_'));
  if(card){ card.querySelector('.hcard-detail')?.remove(); toggleHoldingDetail(card,h); }
  renderCurrentView();
}

async function refreshOne(sym, e){
  if(e) e.stopPropagation();
  await fetchPrice(sym);
  renderCurrentView();
}

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
function init(){
  loadState();
  const d = new Date();
  document.getElementById('hdrDate').textContent =
    d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}).toUpperCase();
  renderDashboard();
  // Pre-load a few key prices quietly
  ['HSBA.L','BGEO.L','IMI.L','ATYM.L','BA.L'].forEach(sym=>
    fetchPrice(sym).then(()=>{ if(currentView==='dashboard') renderDashboard(); else if(currentView==='holdings') renderHoldings(); })
  );
}
init();
